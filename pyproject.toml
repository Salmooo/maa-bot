[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maa-wecom-bot"
version = "1.0.0"
description = "Windows-first MAA automation console with WeCom intelligent bot control"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Pillow>=10.0,<12",
    "requests>=2.31,<3",
    "uiautomation>=2.0.20,<3",
    "websockets>=12,<16",
]

[project.optional-dependencies]
dev = ["ruff>=0.8,<1"]

[project.scripts]
maa-wecom-bot = "maa_bot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
